<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Link Details</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
<div class="bg-white shadow-xl rounded-2xl p-8 max-w-md w-full text-center">
    <h1 class="text-xl font-bold mb-4">Link Details</h1>

    <p class="text-sm text-gray-500 mb-1">Short URL</p>
    <p class="text-blue-700 font-semibold mb-4"><a href="{{ short_url }}" target="_blank">{{ short_url }}</a></p>

    <p class="text-sm text-gray-500 mb-1">Original URL</p>
    <p class="text-gray-700 break-all mb-4">{{ long_url }}</p>

    <img src="{{ qr_code_url }}" alt="QR Code" class="mx-auto w-32 h-32 border rounded mb-4">

    <p class="text-sm text-gray-500">Clicks: <span class="font-semibold">{{ clicks }}</span></p>
    <p class="text-sm text-gray-500">Created: {{ created_at }}</p>
</div>
</body>
</html>
